# ==================== 生产环境配置 ====================

spring:
  # 生产数据库（通过环境变量注入）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_performance_statistics_system?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: e08a7ec1b6671090
  # 生产 Redis（通过环境变量注入）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
  # AI API Key（通过环境变量注入）
  ai:
    dashscope:
      api-key: ${QWEN_API_KEY:YOUR_QWEN_API_KEY}

# MyBatis Flex：生产环境不打印 SQL
mybatis-flex:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# knife4j：生产环境关闭
knife4j:
  enable: false

# 日志级别
logging:
  level:
    com.jgh.ghairouter: INFO
