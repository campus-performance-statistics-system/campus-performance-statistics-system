# ==================== 本地开发环境配置 ====================

spring:
  # 本地数据库
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_performance_statistics_system?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 1234
  # 本地 Redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  # AI API Key
  ai:
    dashscope:
      api-key: ${QWEN_API_KEY:YOUR_QWEN_API_KEY}

# MyBatis Flex：开发环境打印 SQL
mybatis-flex:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 日志级别
logging:
  level:
    com.jgh.ghairouter: DEBUG
