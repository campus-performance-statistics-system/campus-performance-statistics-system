# ==================== 公共配置 ====================
spring:
  application:
    name: campus-performance-statistics-system
  # 默认激活 local 环境
  profiles:
    active: local
  # Session 配置
  session:
    timeout: 2592000  # session 30 天过期
  # AI 模型配置（公共）
  ai:
    dashscope:
      chat:
        options:
          model: qwen2.5-omni-7b
  # 静态资源配置
  web:
    resources:
      static-locations: classpath:/static/,file:uploads/

# MyBatis Flex 公共配置
mybatis-flex:
  configuration:
    map-underscore-to-camel-case: true

# 服务公共配置
server:
  port: 6789
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000  # cookie 30 天过期

# 应用自定义配置
app:
  upload:
    dir: uploads

# springdoc-openapi 公共配置
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.jgh.ghairouter.controller

# knife4j 公共配置
knife4j:
  enable: true
  setting:
    language: zh_cn
